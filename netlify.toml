# Both country domains serve this deployment. Keep only the www → apex
# canonicalisation here; detectlab.eu and detectlab.ro must never redirect to
# each other because they represent different markets.

[[redirects]]
  from = "https://www.detectlab.eu/*"
  to = "https://detectlab.eu/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.detectlab.ro/*"
  to = "https://detectlab.ro/:splat"
  status = 301
  force = true

# ── CORONA ("Satellite imagery 60's") static catalogue snapshot ────────────
# At deploy time the Corona Atlas catalogue (every pass + frame footprint,
# clipped to Europe) is baked into data/corona-europe-catalog.json. The map
# prefers this same-origin, CDN-cached file over the runtime proxy below, so
# the "Satellite imagery 60's" layer works across the whole of Europe with no
# function invocation. `|| true` keeps the deploy alive if the CAST server is
# momentarily down — the runtime proxy then covers for the missing snapshot.
[build]
  publish = "."
  command = "node tools/build-corona-europe-catalog.mjs || true"

# ── CORONA ("Satellite imagery 60's") catalogue proxy ───────────────────────
# The map needs the Corona Atlas product catalogue
# (corona.cast.uark.edu/corona/get_raster_names). That endpoint sends no CORS
# header and returns ~6 MB of worldwide coverage, so a Netlify function
# fetches it server-side, clips it to Europe and caches it on the CDN.
# See netlify/functions/corona-rasters.mjs.
[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/corona/rasters"
  to = "/.netlify/functions/corona-rasters"
  status = 200

# ── SWEDEN · Lantmäteriet terrängskuggning tile proxy ──────────────────────
# The Swedish hillshade WMS ("Markhöjdmodell Visning") is a licensed,
# fee-based product: maps.lantmateriet.se answers 401 without credentials,
# and those credentials must never reach a browser. This function attaches
# them server-side and pins the rendered tiles on the CDN for 7 days.
# Set LANTMATERIET_WMS_USER / LANTMATERIET_WMS_PASSWORD (or
# LANTMATERIET_WMS_TOKEN) in the Netlify environment.
# See netlify/functions/se-hojdmodell.mjs and SWEDEN_LIDAR_LANTMATERIET.md.
[[redirects]]
  from = "/api/geo/se-hojdmodell"
  to = "/.netlify/functions/se-hojdmodell"
  status = 200

# ── 3D TERRAIN · same-origin tile proxy for the MapLibre GL view ───────────
# MapLibre loads every raster tile with crossOrigin="anonymous", so a layer
# whose server sends no Access-Control-Allow-Origin cannot be draped over the
# relief at all — even when the very same layer renders fine as a plain <img>
# in the 2D Leaflet map (Copernicus VHR "discomap", CORONA GeoWebCache, the
# two EPSG:2180 CENAGIS sheets). This route re-serves those tiles from the
# same origin and re-projects the tile bbox for the layers that cannot answer
# Web-Mercator. The allow-list is the shared registry (js/layer-registry.js).
# See netlify/functions/map3d-tile.mjs, netlify/lib/map3d-tile.mjs and
# MAP_3D_TERRAIN.md.
[[redirects]]
  from = "/api/map3d/tile"
  to = "/.netlify/functions/map3d-tile"
  status = 200

# ── DENMARK · Dataforsyningen DHM skyggekort WMTS tile proxy ───────────────
# api.dataforsyningen.dk refuses every imagery request without a token, and
# that token is account-wide (no documented domain/IP restriction), so it
# must never reach a browser. This function attaches it server-side as the
# "token" header and pins the tiles on the CDN for 7 days.
# Set DATAFORSYNINGEN_TOKEN in the Netlify environment.
# See netlify/functions/dk-dhm.mjs and DENMARK_LIDAR_DATAFORSYNINGEN.md.
[[redirects]]
  from = "/api/geo/dk-dhm"
  to = "/.netlify/functions/dk-dhm"
  status = 200
